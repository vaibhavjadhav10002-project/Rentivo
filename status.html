<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status — Rentivo</title>
<meta name="description" content="Current operational status of Rentivo's web app, API, and notification services.">
<link rel="canonical" href="https://www.rentivo.example.com/status.html">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/icons/rentivo-logo.png" type="image/png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<style>
  .page-hero { padding: 72px 0 40px; text-align: center; }
  .status-row { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 8px; box-shadow: 0 0 0 4px rgba(34,197,94,0.15); }
  .status-banner { display: flex; align-items: center; gap: 10px; padding: 16px 20px; background: rgba(34,197,94,0.1); color: #16a34a; border-radius: var(--radius-md); font-weight: 600; font-size: 14.5px; }
</style>
</head>
<body>
<div id="site-header"></div>
<section class="page-hero wrap">
  <span class="eyebrow reveal in">Status</span>
  <h1 class="reveal in" style="font-size:clamp(32px,5vw,46px);">System status</h1>
</section>
<section class="wrap section" style="padding-top:0;max-width:720px;">
  <div class="status-banner reveal"><span class="dot"></span> All systems operational</div>
  <div class="reveal" style="margin-top:24px;">
    <div class="card status-row"><span>Web Application</span><span><span class="dot"></span>Operational</span></div>
    <div style="height:8px;"></div>
    <div class="card status-row"><span>API</span><span><span class="dot"></span>Operational</span></div>
    <div style="height:8px;"></div>
    <div class="card status-row"><span>Push Notifications</span><span><span class="dot"></span>Operational</span></div>
    <div style="height:8px;"></div>
    <div class="card status-row"><span>Database</span><span><span class="dot"></span>Operational</span></div>
  </div>
  <p style="font-size:13px;color:var(--ink-soft);margin-top:24px;">Status shown is illustrative for launch — connect to a real monitoring/status provider before go-live.</p>
</section>
<div id="site-footer"></div>
<script src="/js/site.js"></script>
</body>
</html>
