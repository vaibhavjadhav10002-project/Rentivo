<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Release Notes — Rentivo</title>
<meta name="description" content="What's new in Rentivo.">
<link rel="canonical" href="https://www.rentivo.example.com/release-notes.html">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/icons/rentivo-logo.png" type="image/png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<style>
  .page-hero { padding: 72px 0 40px; text-align: center; }
  .rn-item { display: flex; gap: 24px; padding: 28px 0; border-bottom: 1px solid var(--line); }
  .rn-date { width: 110px; flex-shrink: 0; font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); }
  .rn-tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--gradient-brand-soft); color: var(--brand-purple); margin-bottom: 8px; }
</style>
</head>
<body>
<div id="site-header"></div>
<section class="page-hero wrap">
  <span class="eyebrow reveal in">Release Notes</span>
  <h1 class="reveal in" style="font-size:clamp(32px,5vw,46px);">What's new</h1>
</section>
<section class="wrap section" style="padding-top:0;max-width:760px;">
  <div class="reveal">
    <div class="rn-item">
      <div class="rn-date">v1.0.0</div>
      <div>
        <span class="rn-tag">Launch</span>
        <h3 style="font-size:16px;">Rentivo 1.0 — Android App Launch</h3>
        <p style="font-size:14px;margin-top:8px;">The first Android release: full owner and tenant experience, rent collection, onboarding, notifications, and offline support for core actions.</p>
      </div>
    </div>
  </div>
</section>
<div id="site-footer"></div>
<script src="/js/site.js"></script>
</body>
</html>
